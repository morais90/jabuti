repos:
  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: cargo +nightly fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: test
        name: cargo nextest
        entry: cargo nextest run --workspace --all-targets
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
