[package]
name = "jabuti-cli"
description = "jabuti - code sensors, metrics and gates for AI agent harnesses"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "jabuti"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
jabuti-core.workspace = true
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
