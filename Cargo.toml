[workspace]
resolver = "3"
members = ["crates/jabuti-core", "crates/jabuti-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/williandmorais/jabuti"
authors = ["Willian D. Morais"]

[workspace.dependencies]
jabuti-core = { path = "crates/jabuti-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
