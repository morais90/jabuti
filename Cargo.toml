[workspace]
resolver = "3"
members = ["crates/jabuti-core", "crates/jabuti-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/morais90/jabuti"
authors = ["Willian D. Morais"]
keywords = ["static-analysis", "metrics", "code-quality", "tree-sitter"]
categories = ["development-tools"]

[workspace.dependencies]
jabuti-core = { path = "crates/jabuti-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
